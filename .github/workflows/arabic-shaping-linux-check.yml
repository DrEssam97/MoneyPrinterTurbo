# Fork-only check (never proposed upstream): run the full test suite for the
# Arabic subtitle shaping branch on Linux and macOS. (Windows, where Pillow has
# no Raqm, is covered locally. Pillow 11.3.0's Linux wheels bundle Raqm, so a
# Raqm-less Linux run isn't possible with MoneyPrinterTurbo's pins.)
name: Arabic shaping Linux/macOS check

on:
  push:
    branches: [ci/arabic-subtitle-linux-check]
  workflow_dispatch:

jobs:
  linux:
    name: linux / py${{ matrix.python }}
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
      UV_LINK_MODE: copy
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ffmpeg
      - uses: actions/checkout@v4
      - name: Install uv and sync
        run: |
          pip install --quiet uv
          uv sync --frozen --python python${{ matrix.python }}
      - name: Environment
        run: uv run --no-sync python -c "import PIL, khatt; from PIL import features; print('Pillow', PIL.__version__, '| raqm', features.check('raqm'), '| khatt', khatt.__version__)"
      - name: Arabic subtitle tests
        run: uv run --no-sync python -X utf8 -m pytest -v -p no:cacheprovider test/services/test_subtitle_arabic_shaping.py
      - name: Full test suite
        run: uv run --no-sync python -X utf8 -m pytest -q -p no:cacheprovider -rf test

  macos:
    name: macos / py${{ matrix.python }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Sync
        run: |
          brew install ffmpeg || true
          uv sync --frozen --python ${{ matrix.python }}
      - name: Environment
        run: uv run --no-sync python -c "import PIL, khatt; from PIL import features; print('Pillow', PIL.__version__, '| raqm', features.check('raqm'), '| khatt', khatt.__version__)"
      - name: Arabic subtitle tests
        run: uv run --no-sync python -X utf8 -m pytest -v -p no:cacheprovider test/services/test_subtitle_arabic_shaping.py
      - name: Full test suite
        run: uv run --no-sync python -X utf8 -m pytest -q -p no:cacheprovider -rf test
